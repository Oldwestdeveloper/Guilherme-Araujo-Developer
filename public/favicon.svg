<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ga-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ga-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Code bracket accent < / > -->
  <path d="M12 24 L6 32 L12 40" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
  <path d="M52 24 L58 32 L52 40" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />

  <!-- GA Monogram Typography -->
  <text 
    x="32" 
    y="39" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="23" 
    letter-spacing="1.5"
    filter="url(#shadow)"
  >
    GA
  </text>

  <!-- Tech status dot -->
  <circle cx="48" cy="16" r="3" fill="#10b981" />
  <circle cx="48" cy="16" r="5" stroke="#10b981" stroke-width="1" fill="none" opacity="0.6">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
